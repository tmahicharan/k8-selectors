apiVersion: v1
kind: Pod
metadata:
  name: pod-1
  labels:
   name: nginx
   app: pod1
   project: roboshop
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-2
  labels:
   name: nginx
   project: roboshop
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - pod1
        topologyKey: kubernetes.io/hostname
  containers:
  - name: nginx
    image: nginx